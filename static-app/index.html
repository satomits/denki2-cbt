<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二種電気工事士 CBT 練習</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>第二種電気工事士 CBT 練習</h1>
  </header>

  <main>

    <!-- 設定画面 -->
    <div id="screen-setup">
      <div class="card">
        <h2>問題設定</h2>
        <div class="form-group">
          <label for="sel-year-half">年度・半期</label>
          <select id="sel-year-half">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inp-count">出題数</label>
          <input type="number" id="inp-count" value="30" min="1" max="200">
        </div>
        <div class="form-group">
          <label for="sel-mode">モード</label>
          <select id="sel-mode">
            <option value="normal">通常</option>
            <option value="review">復習（間違えた問題）</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">開始</button>
      </div>

      <div class="card" id="history-card" style="display:none">
        <h2>学習履歴</h2>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- クイズ画面 -->
    <div id="screen-quiz" style="display:none">
      <div class="quiz-header">
        <span id="quiz-progress" class="quiz-progress"></span>
        <button class="btn btn-finish" onclick="finishQuiz()">採点する</button>
      </div>

      <div class="card quiz-container">
        <div class="question-image" id="question-image-wrap">
          <img id="question-image" src="" alt="">
        </div>
        <div id="question-text" class="question-text"></div>
        <div class="choices" id="choices"></div>
        <div id="feedback" class="feedback" style="display:none"></div>
        <div class="quiz-nav">
          <button class="btn" id="btn-prev" onclick="navigate(-1)">&#8592; 前へ</button>
          <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">次へ &#8594;</button>
        </div>
      </div>

      <div id="question-nav" class="question-nav"></div>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" style="display:none">
      <div class="card result-container">
        <div class="result-summary">
          <h2>結果</h2>
          <div class="score" id="result-score"></div>
          <div class="score-percent" id="result-percent"></div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="goSetup()">トップへ戻る</button>
          <button class="btn" onclick="restartQuiz()">同じ設定でもう一度</button>
        </div>
      </div>

      <div class="card">
        <h3>タグ別成績</h3>
        <table>
          <thead>
            <tr><th>分野</th><th>正解 / 出題</th><th>正答率</th></tr>
          </thead>
          <tbody id="result-tags"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
