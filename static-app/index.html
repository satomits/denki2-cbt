<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二種電気工事士 CBT 練習</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>第二種電気工事士 CBT 練習</h1>
      <button class="btn-invert" id="btn-invert" onclick="toggleInvert()">反転</button>
    </div>
  </header>

  <main>

    <!-- 設定画面 -->
    <div id="screen-setup">
      <div class="card">
        <h2>問題設定</h2>
        <div class="form-group">
          <label for="sel-year-half">年度・半期</label>
          <select id="sel-year-half">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sel-section">問題区分</label>
          <select id="sel-section">
            <option value="">すべて（問1〜50）</option>
            <option value="general">一般問題（問1〜30）</option>
            <option value="haisen">配線図（問31〜50）</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sel-count">出題数</label>
          <select id="sel-count">
            <option value="10">10問</option>
            <option value="20">20問</option>
            <option value="30">30問</option>
            <option value="50" selected>50問（本番同等）</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">開始</button>
      </div>

      <div class="card" id="history-card" style="display:none">
        <h2>学習履歴</h2>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- クイズ画面 -->
    <div id="screen-quiz" style="display:none">
      <div class="quiz-header">
        <span id="quiz-progress" class="quiz-progress"></span>
        <button class="btn btn-finish" onclick="finishQuiz()">採点する</button>
      </div>
      <div id="quiz-tags" class="quiz-tags"></div>

      <div class="card quiz-container">
        <!-- 配線図ツール（配線図問題のみ表示） -->
        <div class="haisen-tools" id="haisen-tools" style="display:none">
          <button class="btn btn-notes" onclick="toggleNotes()">注意事項</button>
          <button class="btn btn-diagram" onclick="openDiagram()">配線図を開く</button>
        </div>
        <div id="haisen-notes" class="haisen-notes" style="display:none">
          <img id="haisen-notes-img" src="" alt="配線図 注意事項"
               onclick="openGenericZoom(this.src, '注意事項')" style="cursor:zoom-in;">
        </div>

        <!-- 問題画像（クリックで拡大） -->
        <div class="question-image" id="question-image-wrap" onclick="openImageZoom()" style="cursor:zoom-in;">
          <img id="question-image" src="" alt="" loading="lazy">
        </div>

        <div id="question-text" class="question-text"></div>
        <div class="choices" id="choices"></div>
        <div id="feedback" class="feedback" style="display:none"></div>

        <div class="quiz-nav">
          <button class="btn" id="btn-prev" onclick="navigate(-1)">&#8592; 前へ</button>
          <button class="btn btn-flag" id="btn-flag" onclick="toggleFlag()">後で見直す</button>
          <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">次へ &#8594;</button>
        </div>
      </div>

      <div id="question-nav" class="question-nav"></div>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" style="display:none">
      <div class="card result-container">
        <div class="result-summary">
          <h2>結果</h2>
          <div class="score" id="result-score"></div>
          <div class="score-percent" id="result-percent"></div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="goSetup()">トップへ戻る</button>
          <button class="btn" onclick="restartQuiz()">同じ設定でもう一度</button>
          <button class="btn btn-flag" id="btn-retry-wrong" style="display:none" onclick="retryWrongOnly()">間違えた問題をやり直す</button>
        </div>
      </div>

      <div class="card">
        <h3>タグ別成績</h3>
        <table>
          <thead>
            <tr><th>分野</th><th>正解 / 出題</th><th>正答率</th></tr>
          </thead>
          <tbody id="result-tags"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 配線図モーダル -->
  <div id="diagram-modal" class="diagram-modal" style="display:none">
    <div class="diagram-modal-header">
      <span>配線図（スクロール: 拡大縮小 / ドラッグ: 移動）</span>
      <button class="btn-close" onclick="closeDiagram()">&times;</button>
    </div>
    <div class="diagram-viewport" id="diagram-viewport">
      <img id="diagram-img" src="" alt="配線図" draggable="false">
    </div>
    <div class="diagram-controls">
      <button class="btn" onclick="zoomDiagram(-0.2)">&#8722;</button>
      <span id="zoom-level">100%</span>
      <button class="btn" onclick="zoomDiagram(0.2)">＋</button>
      <button class="btn" onclick="resetDiagram()">リセット</button>
    </div>
  </div>

  <!-- 問題画像ズームモーダル -->
  <div id="image-zoom-modal" class="diagram-modal" style="display:none">
    <div class="diagram-modal-header">
      <span id="image-zoom-title">問題画像（スクロール: 拡大縮小 / ドラッグ: 移動）</span>
      <button class="btn-close" onclick="closeImageZoom()">&times;</button>
    </div>
    <div class="diagram-viewport" id="image-zoom-viewport">
      <img id="image-zoom-img" src="" alt="" draggable="false">
    </div>
    <div class="diagram-controls">
      <button class="btn" onclick="zoomImage(-0.2)">&#8722;</button>
      <span id="image-zoom-level">100%</span>
      <button class="btn" onclick="zoomImage(0.2)">＋</button>
      <button class="btn" onclick="resetImageZoom()">リセット</button>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
